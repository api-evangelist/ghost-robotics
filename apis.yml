aid: ghost-robotics
name: Ghost Robotics
description: >-
  Ghost Robotics designs and manufactures quadrupedal unmanned ground vehicles
  (Q-UGV), with its flagship Vision 60 platform deployed across defense,
  public safety, law enforcement, industrial, construction, and education
  customers. The platform supports modular payloads for sensing, comms, and
  manipulation. Ghost Robotics provides a developer SDK only to vetted
  partners and integrators and does not operate a public developer portal,
  open API, or public GitHub organization.
